# Basic Card Plugin Manifest Template
# 基础卡片插件清单模板
# 遵循《插件系统技术规格》manifest.yaml 规范

# === 规范版本 ===
schemaVersion: "1.0.0"

# === 基础信息 ===
id: "chipshub.template-card"              # ⚠️ 必须修改：格式 "publisher.plugin-name"
name: "i18n.plugin.template_card.name"    # ⚠️ 必须修改：插件显示名称（多语言 key）
version: "1.0.0"                          # 版本号，遵循语义化版本
type: "card"                              # 固定值：卡片插件
publisher: "chipshub"                     # ⚠️ 修改为你的发行商ID
description: "i18n.plugin.template_card.desc"  # ⚠️ 必须修改：插件描述（多语言 key）
icon: "assets/icon.png"                   # 插件图标路径（相对包根）

# === 入口文件 ===
# 卡片插件必须提供 renderer 和 editor 两个入口
entry:
  renderer: "renderer/index.html"         # 渲染器 iframe 入口
  editor: "editor/index.html"             # 编辑器 iframe 入口

# === 权限声明 ===
permissions:
  - "card.read"                           # 读取卡片
  - "card.write"                          # 写入卡片
  - "resource.fetch"                      # 获取资源

# === 能力声明 ===
capabilities:
  cardType: "TemplateCard"                # ⚠️ 必须修改：卡片类型名称，必须是 PascalCase

# === 兼容性 ===
compatibility:
  host: ">=1.0.0"                         # 要求的主机版本范围
  sdk: ">=1.0.0"                          # 要求的 SDK 版本范围
  platform:                               # 支持的平台
    - "win32"
    - "darwin"
    - "linux"

# === 依赖声明 ===
dependencies:
  plugins: []                             # 依赖的其他插件

# === 多语言配置 ===
locales:
  default: "zh-CN"                        # 默认语言
  supported:                              # 支持的语言列表
    - "zh-CN"
    - "zh-TW"
    - "en-US"
    - "ja-JP"
    - "ko-KR"
  path: "locales"                         # 语言文件目录

# === 配置 Schema ===
# ⚠️ 定义你的卡片配置结构，与 src/types/config.ts 中的接口对应
# 此 Schema 用于验证卡片配置文件
