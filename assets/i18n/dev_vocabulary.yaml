# 开发阶段词汇表
#
# ⚠️ 使用说明：
# 1. 开发时使用词汇 key（如 'editor.upload'）
# 2. 构建时自动替换为系统编码（如 'i18n.plugin.400001'）
# 3. 运行时系统根据当前语言返回翻译文本
# 4. 修改词汇内容以匹配你的卡片类型

# 插件生命周期
plugin:
  initialized: "插件已初始化"
  already_initialized: "插件已经初始化"
  not_initialized: "插件未初始化"
  started: "插件已启动"
  stopped: "插件已停止"
  destroyed: "插件已销毁"

# 渲染器
renderer:
  loading: "正在加载..."
  render_success: "渲染成功"
  render_failed: "渲染失败"

# 编辑器
editor:
  placeholder: "请输入内容..."
  save_success: "保存成功"
  save_failed: "保存失败"

# 工具栏
toolbar:
  undo: "撤销"
  redo: "重做"

# 错误消息
error:
  invalid_config: "配置无效"
  missing_field: "缺少必需字段: {field}"
  load_failed: "加载失败"
  resource_not_found: "资源未找到"
  render_failed: "渲染失败: {reason}"
  upload_failed: "上传失败"
  editor_not_initialized: "编辑器未初始化"

# 确认对话框
confirm:
  delete: "确定要删除吗？"
  discard_changes: "放弃未保存的更改吗？"
  reset: "确定要重置吗？"

# 按钮文本
button:
  ok: "确定"
  cancel: "取消"
  save: "保存"
  delete: "删除"
  edit: "编辑"
  preview: "预览"
  reset: "重置"
  close: "关闭"

# 状态文本
status:
  ready: "就绪"
  loading: "加载中..."
  saving: "保存中..."
  success: "成功"
  failed: "失败"

# 日志
log:
  renderer_created: "渲染器已创建"
  editor_created: "编辑器已创建"
  service_registered: "服务已注册: {service}"

# 通用
common:
  ok: "确定"
  cancel: "取消"
  save: "保存"
  delete: "删除"
  close: "关闭"
